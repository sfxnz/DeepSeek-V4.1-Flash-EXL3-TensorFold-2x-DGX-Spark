# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.70 stays 0.70). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model sfxnz/DeepSeek-V4.1-Flash-EXL3
  revision: &revision 982b70452f399814f56b46272fd30394ae10d58c
  branch: 2.0bpw-mcg-viterbi-lmhead-mxfp8
  served_name: &served_name deepseek-ai/DeepSeek-V4.1-Flash
  family: DeepSeek-V4.1-Flash
  quant: routed experts EXL3 2 bpw (mcg codebook); everything else DeepSeek's own bytes (FP8 e4m3 with ue8m0 32x32 block scales, LM head MXFP8, DSpark experts MXFP4, Engram tables)
  # The snapshot run.sh checks on both nodes before a start. From the Hub at this revision
  # (evidence/s1-snapshot-pins/pins.json: sha256 of the downloaded config.json and index; the index's 48 shards;
  # their sizes from the file listing, summed).
  config_sha256: &config_sha256 6469adab394edead3eec148323e7471582d08acdf60a438bf0c9e815b69f36c5
  index_sha256: &index_sha256 91731e4af38696bd4c09e960f4b599d1d49f35d445e4f88a43cc355d9e139f03
  shards: &shards 48
  shard_bytes: &shard_bytes 357466041064
  license: MIT (DeepSeek-V4.1-Flash model card)

image:
  base: nvcr.io/nvidia/pytorch:26.07-py3
  digest: sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
  local_tag: &image tf-dsv41-flash:0.6.6-19f5478
  build: docker/Dockerfile (pip install git+TF_REPO@TF_SHA under docker/constraints.txt; the commit pip installed is checked; no installed package may change, so torch and triton stay the base's)

engine:
  name: tensorfold
  version: 0.6.6 + deepseek_v41 CUDA family (ashhart/TensorFold PR 390 and PR 391) + the device keyed draw for top_k-off rows + the speed units C1, C2, C3, C4, C5, C7, C8 + concurrent requests (--parallel 1 to 4, units N0-N10) + the decode units P4, P2, P10, P1, P6b
  # The fork's integration branch: release v0.6.4 (6ea5ade), the family (e174ee0 has PR 391's tip tree, 0d91389), the
  # device keyed draw (C6, C6b; db7f53e has 41306d5's tree), then the speed units, each merged after its own receipts
  # (lab data/tf-dsv41/receipts/c1..c8): C1 prompt decoder-row skip, C3 prompt-window EXL3 expert kernel, C2 decode
  # fusion, C7 packed caches and the split decode index selection, C4 Engram I/O off the decode path with resident
  # scale rows, C5 device-drawn drafts and the confidence draft policy (engine default: up to 5 drafts, stop under a
  # confidence product of 0.15), C8 prompt chunks in two row halves and the kept snapshot from inside its chunk; then
  # concurrent requests (lab data/tf-dsv41/receipts/n0..n10): up to 4 lanes, each holding a whole window, share one
  # verify forward a round, prompts fill between rounds (--decode-share), and every reply equals its solo run. That
  # tip is b86514a. Then upstream's final Python line, origin/python-0.6 at ed78d6f (v0.6.6, cb2ebf0, and later:
  # API keys, --name-priority, the tool-JSON rewrite), merged as dc971a2, with f9dd67b (the thinking-off hint names
  # chat_template_kwargs.thinking); then five decode units, each kept on its own ABBA (lab
  # data/tf-dsv41/receipts/sp-*): P4 one grouped launch for wo_a (d139943), P10 greedy target draws on the device
  # (2987c8a), P2 a paced L2 warm of the next dense weights (378cea7), P1 shape-picked MXFP8 decode tiles (b44da3e),
  # P6b DSpark proposals batched across lanes, built late (c57c10e). Each unit is bit-exact: replies equal
  # b86514a's. They are the engine's defaults, so no recipe flag turns them on.
  # Upstream's Python engine ends at 0.6.6 on its python-0.6 branch (ashhart/TensorFold issue 286); it closed PRs
  # 390, 391 and 408. Its main is the Zig engine 1.0.x, which has no DeepSeek-V4 family (a port for 1.0.x, CHANGELOG
  # 1.0.0) and serves CUDA for Nemotron only, on one GPU. So the recipe pins the fork. A bump needs new evidence.
  repo: &tf_repo https://github.com/sfxnz/TensorFold.git
  branch: dsv41-recipe-engine5
  commit: &tf_sha 19f5478ba778531ffb9a1ebb9c1ca7e06b8ceacb
  base_release: v0.6.6 (cb2ebf0; upstream's python-0.6 at ed78d6f merged as dc971a2), on v0.6.4 (6ea5ade)
  upstream_prs: [https://github.com/ashhart/TensorFold/pull/390, https://github.com/ashhart/TensorFold/pull/391, https://github.com/ashhart/TensorFold/pull/408]
  upstream_status: https://github.com/ashhart/TensorFold/issues/286 (Python engine ends at 0.6.6 on branch python-0.6; PRs 390, 391 and 408 closed; main is the Zig engine 1.0.x, with no DeepSeek-V4 family and CUDA for Nemotron only, one GPU)
  family_tip: 0d91389b1fe738dd24c49cc045977e2ac5324ea4 (PR 391's tip; the same tree as e174ee0 on the fork's integration branch)
  keyed_draw: 0582d5f (C6) and 3ab53da (C6b), merged as 684e2eb and d663c34 (db7f53e has the tree of 41306d5, the s4 pin)
  previous: b86514a5ac8700b32e7b24f1095349df4ce2b922 (fork branch dsv41-recipe-engine4; session s6), 903a1e8af62c8f46eceee6b95481706ada30ae49 (dsv41-recipe-engine3; session s5), 41306d5e2acd5651fc0954609b3a651d2ef61d6e (dsv41-recipe-engine2; session s4), ec28f35c7568986666dc996f3c8b01ea59b6d0ca (dsv41-recipe-engine; sessions s2 and s3)

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  # Keys starting TF_DSV41_ are engine knobs: run.sh passes each non-empty one to both ranks as
  # `docker run -e KEY=VALUE`, from one function. An empty value is not passed (the engine default applies).
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    TF_REPO: *tf_repo
    TF_SHA: *tf_sha
    CONTAINER_NAME: tf-dsv41-flash
    PORT: 8000
    MASTER_PORT: 29571
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1,roceP2p1s0f1
    TP: *tp
    # measured: the native window. s2 booted run.sh at 1048576, ran the frozen ruler there, and found needles at
    # 130k, 258k, 524k and 1,039,528 prompt tokens, MemAvailable never below 22 GiB on either node
    # (evidence/s2-run-sh-ec28f35/ctx1m/needles.jsonl, evidence/s2-run-sh-ec28f35/ctx1m/memwatch.tsv); s3 booted it
    # twice more at the shipped defaults (evidence/s3-default-1m/decode.txt); s5 twice at 903a1e8, with the
    # 1,039,528-token needle again (evidence/s5-final/bootF/needle.jsonl, MemAvailable at least 15.0 / 23.7 GiB over
    # that boot); s6 six times at b86514a, with that needle found while 3 other lanes decoded
    # (evidence/s6-concurrent/2B/needle_lanes.jsonl); s7 five times at b86514a and 19f5478, with that needle beside 3
    # lanes again at 19f5478 (evidence/s7-speed/2B/needle_lanes.jsonl).
    CONTEXT: 1048576
    # Requests decoded together, 1 to 4 (the family's MAX_LANES); each lane holds a whole CONTEXT window, allocated
    # at startup. measured: s6 ran PARALLEL=1 and 4 ABBA through run.sh. At 4 x 1048576 MemAvailable stayed at least
    # 17.4 GiB on the head and 21.9 on the worker on warm-cache boots (13.0 / 14.7 GiB while the first start compiled
    # the kernels, evidence/s6-concurrent/W1/memwatch.tsv), and a lone request decoded the ruler's cells within 0.5% of
    # PARALLEL=1, every c=1 cell within 1.31% (evidence/s6-concurrent/abba_table.txt), so 4 ships. run.sh computes its memory-gate floor from PARALLEL and
    # CONTEXT.
    PARALLEL: 4
    # With PARALLEL 2 or more, a new prompt fills between decode rounds, which take this share of each prompt span's
    # time (the engine's default; 0: whole prompts first). Not passed at PARALLEL 1, where it has no effect. s6: a 16k
    # prompt arriving while 3 lanes decode reaches its first token in 15.0 s at 0.25, 18.0-18.7 s at 0.5 and 24.0 s at 1
    # (9.6 s alone), the lanes decoding at about 4.2, 7.2 and 11.3 tok/s meanwhile (evidence/s6-concurrent/abba_table.txt).
    DECODE_SHARE: 0.5
    # The engine's default draft policy, written out so a bump cannot change it silently: up to 5 DSpark drafts a
    # round, the chain stopping where the drafts' confidence product falls under 0.15 (TF_SHA's
    # families/deepseek_v41/cuda DEFAULT_DRAFTS, DEFAULT_CONFIDENCE). A fixed count (MTP_DRAFTS alone, MTP_CONFIDENCE
    # empty) drafts that many every round. Decision DRAFTS in evidence/decision.tsv.
    MTP_DRAFTS: 5
    MTP_CONFIDENCE: 0.15
    THINKING: 0
    MAX_TOKENS: 4096
    # --top-p on both ranks: the server's top_p when a request sends none. DeepSeek's model card recommends
    # temperature 1.0 and top_p "0.95 or 1.0"; at ec28f35 a top_k-off row without a top_p cut (1.0) drew on the
    # device and a cut (< 1) read each rank's vocabulary half to the host (evidence/decision.tsv TOPP1). From 41306d5 on
    # both draw on the device at the same cost a round (evidence/s4-device-nucleus/derived.txt); 1.0 stays the
    # default. Temperature is not passed: the engine's default, 1.0, applies.
    TOP_P: 1.0
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    CONFIG_SHA256: *config_sha256
    INDEX_SHA256: *index_sha256
    SHARDS: *shards
    SHARD_BYTES: *shard_bytes
    SKIP_DOWNLOAD: 0
    TF_CACHE: $HOME/.cache/tensorfold-dsv41
    ORCHESTRATE: auto
    OOM_SCORE_ADJ: 1000
    MEMGUARD: 1
    MEMGUARD_MIN_AVAIL_MB: 3072
    MEMGUARD_MIN_SWAP_FREE_MB: 2048
    MEM_GATE_GIB: 100
    MEM_GATE_TIMEOUT: 600
    READY_TIMEOUT: 1800
    BENCH_ONLY: 0
    EXTRA_ARGS: ""
    EXTRA_ENV: ""
    # -- engine knobs (docs/recipes/deepseek-v4.1-flash.md "Serve"): the kept-prompt arena's GiB (engine default 3)
    #    and entries (engine default 8). Empty: not passed, the engine default applies on both ranks.
    TF_DSV41_CACHE_GIB: ""
    TF_DSV41_CACHE_ENTRIES: ""

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Engine: "TensorFold `{TF_SHA}` (v0.6.6 + the deepseek_v41 CUDA family, its speed units, concurrent requests and the decode units P4, P2, P10, P1, P6b) from `{TF_REPO}`, built into `{IMAGE}` from `docker/Dockerfile`"
    - Model: "`{MODEL}` at `{SNAPSHOT_SHA}`, served from the HF cache `{HF_CACHE}` (read-only) on each node"
    - Snapshot check: "`config.json` sha256 `{CONFIG_SHA256}`, index sha256 `{INDEX_SHA256}`, {SHARDS} shards, {SHARD_BYTES} shard bytes, every shard's header ending at its size"
    - Ranks: "`--tp {TP}`: rank 1 on `{WORKER_HOST}` first, then rank 0 (HTTP) on the head; rendezvous `{HEAD_IP}:{MASTER_PORT}`"
    - "`--context`": "{CONTEXT}, the model's native window (tested through run.sh: needles at 130k, 258k, 524k and 1,039,528 prompt tokens, all found)"
    - Concurrency: "`--parallel {PARALLEL}`: up to {PARALLEL} requests decode together, each lane holding a whole `--context` window allocated at startup; more requests wait for a free lane. `--decode-share {DECODE_SHARE}`: a new prompt fills between the other lanes' decode rounds, which take {DECODE_SHARE} of each prompt span's time (passed only at `PARALLEL` 2 or more)"
    - Drafting: "`--mtp-drafts {MTP_DRAFTS} --mtp-confidence {MTP_CONFIDENCE}`, the engine's default policy: up to {MTP_DRAFTS} DSpark drafts a round, the chain stopping where the drafts' confidence product falls under {MTP_CONFIDENCE} (`MTP_CONFIDENCE` empty: {MTP_DRAFTS} drafts every round; 0 drafts: one token a round)"
    - Thinking: "off (`--no-thinking`, `THINKING={THINKING}`) on both ranks; a request turns it on with `chat_template_kwargs.thinking` or an effort name"
    - "`--max-tokens`": "{MAX_TOKENS} (the reply cap when a request sets none)"
    - Sampling: "`--top-p {TOP_P}` on both ranks (the top_p when a request sends none); temperature not passed (the engine's default, 1.0); top-k off (the family's default). DeepSeek's model card: temperature 1.0, top_p 0.95 or 1.0"
    - NCCL: "`NCCL_IB_HCA={HCA}`, `NCCL_SOCKET_IFNAME={IFACE}`"
    - Memory: "MemAvailable >= {MEM_GATE_GIB} GiB on each node before a start; memguard {MEMGUARD_MIN_AVAIL_MB} MB RAM and {MEMGUARD_MIN_SWAP_FREE_MB} MB swap"
    - Kernel cache: "`{TF_CACHE}/<TF_SHA>` on each node, mounted at `/cache/tf`"
    - API: "`http://<head>:{PORT}/v1`, served as `{SERVED_NAME}`"
    - Container: "`{CONTAINER_NAME}` on each node"

measured:
  # The README decode table. One row per (phase, concurrency); a row's three numbers come from one file with a
  # bench_decode.py `SUMMARY` (one run, or scripts/decode_compute.py's two-boot rows in the same format).
  # evidence: the file under evidence/ that contains them, or null while there is none.
  # kit/render.py renders a row with evidence null as "not yet measured on this pair" and refuses a number without
  # evidence.
  decode:
    conditions: "frozen bench_decode.py (sha256 3172cbc4…), streamed, thinking off, ignore_eos, max_tokens 200, 9 runs, two boots at the shipped defaults (s7 boots 2B and 3B, 2026-10-10: TensorFold `19f5478`, `--context 1048576 --parallel 4 --decode-share 0.5`, `--top-p 1.0`, `--mtp-drafts 5 --mtp-confidence 0.15`, no env override); each row is the median of the two per-boot medians (evidence/s7-speed/decode.txt, which gives each boot's); TP=2 through `./run.sh`, `tools/session_gate.sh` with RUNS=9 RUNS_LONG=9. Concurrency N sends N streams at once, 9 waves: decode is the median stream's rate after its first token, aggregate the median wave's tokens over its wall time, TTFT p50 over every stream (runs 2 to 9 resume the kept prompt). prose, structured and prose_long are the ruler's greedy cells. The sampled rows send the ruler's prose prompt with no sampling field (the server's temperature 1.0, top_p 1.0, top-k off) or top_p 0.95, no seed, so every stream draws the same reply (evidence/s7-speed/scripts/sampled_conc.py). Every stream sends one prompt, which overstates what lanes gain on distinct prompts; the diverse cell below the table sends a different prompt to each stream. Before (s7 boots 1A and 4A, TensorFold `b86514a`, the same session; c=1 decode, c=2 and 4 aggregate): prose 56.12 / 82.35 / 116.01, structured 97.88 / 144.36 / 200.62, prose_long 40.93 / 60.81 / 86.56 (evidence/s7-speed/abba_table.txt)"
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: 59.3, aggregate: 59.2, ttft_p50: 0.07, evidence: evidence/s7-speed/decode.txt,
         note: "The prose reply ends at its end token after 74 tokens; ignore_eos decodes the other 126 (post_eos_fraction 0.63)."}
      - {phase: prose, concurrency: 2, decode: 48.0, aggregate: 95.3, ttft_p50: 0.13, evidence: evidence/s7-speed/decode.txt}
      - {phase: prose, concurrency: 4, decode: 37.3, aggregate: 148.7, ttft_p50: 0.25, evidence: evidence/s7-speed/decode.txt}
      - {phase: structured, concurrency: 1, decode: 105.1, aggregate: 105.1, ttft_p50: 0.07, evidence: evidence/s7-speed/decode.txt}
      - {phase: structured, concurrency: 2, decode: 84.5, aggregate: 167.6, ttft_p50: 0.13, evidence: evidence/s7-speed/decode.txt}
      - {phase: structured, concurrency: 4, decode: 63.8, aggregate: 254.1, ttft_p50: 0.25, evidence: evidence/s7-speed/decode.txt}
      - {phase: prose_long, concurrency: 1, decode: 43.3, aggregate: 43.3, ttft_p50: 0.07, evidence: evidence/s7-speed/decode.txt}
      - {phase: prose_long, concurrency: 2, decode: 35.3, aggregate: 70.6, ttft_p50: 0.13, evidence: evidence/s7-speed/decode.txt}
      - {phase: prose_long, concurrency: 4, decode: 28.0, aggregate: 111.3, ttft_p50: 0.25, evidence: evidence/s7-speed/decode.txt}
      - {phase: "sampled (no field)", concurrency: 1, decode: 44.6, aggregate: 44.6, ttft_p50: 0.07, evidence: evidence/s7-speed/decode.txt}
      - {phase: "sampled (no field)", concurrency: 2, decode: 36.5, aggregate: 73.0, ttft_p50: 0.13, evidence: evidence/s7-speed/decode.txt}
      - {phase: "sampled (no field)", concurrency: 4, decode: 28.9, aggregate: 115.8, ttft_p50: 0.26, evidence: evidence/s7-speed/decode.txt}
      - {phase: "sampled (top_p 0.95)", concurrency: 1, decode: 39.5, aggregate: 39.5, ttft_p50: 0.07, evidence: evidence/s7-speed/decode.txt}
      - {phase: "sampled (top_p 0.95)", concurrency: 2, decode: 33.0, aggregate: 65.8, ttft_p50: 0.13, evidence: evidence/s7-speed/decode.txt}
      - {phase: "sampled (top_p 0.95)", concurrency: 4, decode: 26.5, aggregate: 106.0, ttft_p50: 0.26, evidence: evidence/s7-speed/decode.txt}

